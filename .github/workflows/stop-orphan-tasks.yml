# Stop orphaned standalone the-fork tasks (the inventory runs that ignored the
# command override and are running full servers). Stops ONLY standalone tasks
# (group "family:the-fork"); service tasks (group "service:the-fork") are the
# live web service and are never touched. Dispatch-only helper, not merged.
name: stop-orphan-tasks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECS_CLUSTER: cerebrum

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Stop orphaned standalone the-fork tasks
        run: |
          tasks=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --family the-fork --query 'taskArns[]' --output text)
          for task in $tasks; do
            group=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" --query 'tasks[0].group' --output text)
            if [ "$group" = "family:the-fork" ]; then
              echo "stopping orphan task: $task"
              aws ecs stop-task --cluster "$ECS_CLUSTER" --task "$task"
            else
              echo "leaving service task alone: $task ($group)"
            fi
          done
