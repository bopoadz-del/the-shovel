name: document-include

# Ops workflow (Advisor 20:33Z, 13 Nov): the reverse of document-exclude.yml.
# Runs POST /v1/admin/documents/{document_id}/include on the live deployment.
#
# Safety, in order:
#   1. A plan call (execute=false) runs first, ALWAYS. It prints the document,
#      its status, the stored exclusion record, whether it is eligible (only a
#      row carrying metadata.excluded is) and plan_hash. It writes nothing.
#   2. The write runs only when the operator passed execute=true, a reason, AND
#      an expected_plan_hash equal to the live plan's (from an earlier plan run).
#      The route checks eligibility and the hash again server-side.
#   3. The write clears metadata.excluded (kept under metadata.included_back)
#      and the tombstone: status UNVERIFIED, retrieval_visible=true. It does
#      not restore chunks; run doc-reindex-once for the document afterwards.
# project_id, document_id, reason and expected_plan_hash have NO committed
# default: the operator supplies them.

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project the document belongs to (no default committed)"
        required: true
      document_id:
        description: "Document to bring back (no default committed)"
        required: true
      reason:
        description: "Owner's reason, stored on the row (required with execute=true)"
        required: false
        default: ""
      expected_plan_hash:
        description: "plan_hash from an earlier plan run; the write runs only if the live plan equals it"
        required: false
        default: ""
      execute:
        description: "false = plan only (default). true = clear the owner exclusion"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  include:
    name: Document include back (live)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ vars.SHOVEL_BASE_URL || 'https://theshovel.ai' }}
      PROJECT_ID: ${{ inputs.project_id }}
      DOCUMENT_ID: ${{ inputs.document_id }}
      REASON: ${{ inputs.reason }}
      EXPECTED: ${{ inputs.expected_plan_hash }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Resolve CEREBRUM_MASTER_KEY from the live task definition
        run: |
          td=$(aws ecs describe-services --cluster cerebrum --services the-fork --query 'services[0].taskDefinition' --output text)
          val=$(aws ecs describe-task-definition --task-definition "$td" --query "taskDefinition.containerDefinitions[0].environment[?name=='CEREBRUM_MASTER_KEY'].value | [0]" --output text)
          if [ -z "$val" ] || [ "$val" = "None" ]; then
            ref=$(aws ecs describe-task-definition --task-definition "$td" --query "taskDefinition.containerDefinitions[0].secrets[?name=='CEREBRUM_MASTER_KEY'].valueFrom | [0]" --output text)
            case "$ref" in
              arn:aws:secretsmanager:*)
                secret_id=$(printf '%s' "$ref" | cut -d: -f1-7)
                json_key=$(printf '%s' "$ref" | cut -d: -f8)
                secret_json=$(aws secretsmanager get-secret-value --secret-id "$secret_id" --query SecretString --output text)
                if [ -n "$json_key" ]; then
                  val=$(printf '%s' "$secret_json" | JSON_KEY="$json_key" python3 -c "import os,sys,json;print(json.load(sys.stdin).get(os.environ['JSON_KEY'],''))")
                else
                  val=$secret_json
                fi
                ;;
              arn:aws:ssm:*|/*) val=$(aws ssm get-parameter --with-decryption --name "${ref##*parameter}" --query Parameter.Value --output text) ;;
            esac
          fi
          [ -n "$val" ] && [ "$val" != "None" ] || { echo "::error::CEREBRUM_MASTER_KEY is not configured on the live the-fork task definition"; exit 1; }
          echo "::add-mask::$val"; echo "CEREBRUM_MASTER_KEY=$val" >> "$GITHUB_ENV"

      - name: Plan (execute=false, always)
        run: |
          set -euo pipefail
          enc() { jq -rn --arg v "$1" '$v|@uri'; }
          url="${BASE_URL%/}/v1/admin/documents/$(enc "$DOCUMENT_ID")/include?project_id=$(enc "$PROJECT_ID")&execute=false"
          echo "POST ${url}"
          curl --fail-with-body --max-time 300 -X POST \
            -H "Authorization: Bearer ${CEREBRUM_MASTER_KEY}" \
            -H "Accept: application/json" \
            -o plan.json -w "\nHTTP %{http_code}\n" "${url}"
          jq '.plan' plan.json
          {
            echo "### Plan (execute=false)"
            echo "- document_id: $(jq -r '.plan.document_id' plan.json) ($(jq -r '.plan.original_name' plan.json), doc_type=$(jq -r '.plan.doc_type' plan.json))"
            echo "- ingest_status: $(jq -r '.plan.ingest_status' plan.json) ($(jq -r '.plan.ingest_status_reason' plan.json)), retrieval_visible: $(jq -r '.plan.retrieval_visible' plan.json), chunk_rows: $(jq -r '.plan.chunk_rows' plan.json)"
            echo "- excluded (stored): $(jq -c '.plan.excluded' plan.json)"
            echo "- eligible: $(jq -r '.plan.eligible' plan.json) $(jq -r '.plan.not_eligible // ""' plan.json)"
            echo "- status_after: $(jq -r '.plan.status_after' plan.json)"
            echo "- plan_hash (live): $(jq -r '.plan.plan_hash' plan.json)"
            echo "- expected_plan_hash (operator): ${EXPECTED}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "PLANNED=$(jq -r '.plan.plan_hash' plan.json)" >> "$GITHUB_ENV"

      - name: Refuse the write when the plan differs from the expected hash
        if: inputs.execute
        run: |
          set -euo pipefail
          [ -n "$REASON" ] || { echo "::error::reason is required with execute=true"; exit 1; }
          if [ "$PLANNED" != "$EXPECTED" ]; then
            echo "::error::live plan_hash=${PLANNED} != expected_plan_hash=${EXPECTED}; no write was made"
            echo "**REFUSED:** plan ${PLANNED} != expected ${EXPECTED}; nothing written." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Include back (execute=true)
        if: inputs.execute
        run: |
          set -euo pipefail
          enc() { jq -rn --arg v "$1" '$v|@uri'; }
          url="${BASE_URL%/}/v1/admin/documents/$(enc "$DOCUMENT_ID")/include?project_id=$(enc "$PROJECT_ID")&execute=true&plan_hash=$(enc "$EXPECTED")&reason=$(enc "$REASON")"
          curl --fail-with-body --max-time 300 -X POST \
            -H "Authorization: Bearer ${CEREBRUM_MASTER_KEY}" \
            -H "Accept: application/json" \
            -o applied.json -w "\nHTTP %{http_code}\n" "${url}"
          jq '.' applied.json
          {
            echo "### Write (execute=true)"
            echo "- executed: $(jq -r '.executed' applied.json) refused: $(jq -r '.refused // "-"' applied.json)"
            echo "- ingest_status: $(jq -r '.ingest_status' applied.json), retrieval_visible: $(jq -r '.retrieval_visible' applied.json), chunk_count: $(jq -r '.chunk_count' applied.json)"
            echo "- excluded after: $(jq -c '.excluded_after' applied.json)"
            echo "- included_back (as stored): $(jq -c '.included_back' applied.json)"
            echo "- next: doc-reindex-once for this document brings its chunks back"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(jq -r '.executed' applied.json)" = "true" ] || { echo "::error::write refused"; exit 1; }
          [ "$(jq -r '.excluded_after' applied.json)" = "null" ] || { echo "::error::exclusion still stored after the write"; exit 1; }

      - name: Upload responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-include-response
          path: |
            plan.json
            applied.json
          if-no-files-found: ignore
          retention-days: 7
