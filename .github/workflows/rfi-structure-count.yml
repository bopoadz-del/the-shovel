# Q-3: run the READ-ONLY RFI structure count as a one-off ECS task.
#
# Same shape as pdf-page-coverage.yml: the existing `the-fork` task definition
# (DATABASE_URL) with a command override that runs scripts/rfi_structure_count.py.
# The script issues parameterised SELECTs only (documents by id prefix, the
# anchor project's chunks in order); it never chunks, re-splits, embeds or
# writes. The workflow has contents:read and no write step. The anchor id
# arrives as a dispatch input -- no document identifier lives in this
# repository. PUBLIC repository: the run log carries document ids, counts and
# chunk indexes only. An ops measurement, not a gate.
name: rfi-structure-count

on:
  workflow_dispatch:
    inputs:
      anchor_id:
        description: "one document id (or unambiguous prefix) whose project is counted (read-only)"
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECS_CLUSTER: cerebrum
  TASK_FAMILY: the-fork
  SERVICE_FOR_NETWORK: the-fork

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the read-only RFI structure count as a one-off task
        env:
          ANCHOR: ${{ inputs.anchor_id }}
        run: |
          netcfg=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$SERVICE_FOR_NETWORK" --query 'services[0].networkConfiguration' --output json)
          container=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query 'taskDefinition.containerDefinitions[0].name' --output text)
          overrides=$(jq -cn --arg c "$container" --arg a "$ANCHOR" '{containerOverrides:[{name:$c, environment:[{name:"WORKER_COMMAND",value:"python -m scripts.rfi_structure_count"},{name:"RFI_ANCHOR_ID",value:$a}]}]}')
          arn=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "$TASK_FAMILY" --launch-type FARGATE --network-configuration "$netcfg" --overrides "$overrides" --query 'tasks[0].taskArn' --output text)
          for attempt in $(seq 1 30); do
            aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$arn" 2>/dev/null && break
            sleep 10
          done
          id=${arn##*/}
          # Publish ONLY the script's own marked lines (MARK in the script);
          # the rest of the container stream is counted, never printed.
          aws logs get-log-events --log-group-name /ecs/the-fork --log-stream-name "ecs/$container/$id" --output json > events.json
          jq -r '.events[].message' events.json > stream.txt
          rm -f events.json
          sed -n 's/^RFI| //p' stream.txt | tee -a "$GITHUB_STEP_SUMMARY"
          echo "container lines not from the script: $(grep -vc '^RFI| ' stream.txt || true) (not shown)"
          rm -f stream.txt
          code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$arn" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "task exit code: $code"
          test "$code" = "0"
