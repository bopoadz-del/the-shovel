name: Docker Build and Publish

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cerebrum-blocks

# Newer push to the same ref supersedes the running build (the newest
# image is the one that matters for a given branch/PR anyway).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # arm64 builds via QEMU emulation on free GHA runners take ~5-10x
      # the native build time. Combined with the multi-stage Python +
      # heavy native deps (pymupdf, ifcopenshell, numpy/scipy), the
      # arm64 leg alone runs 18-22 minutes — pushing the total build
      # past the ~10-minute validity window of the Azure SAS tokens the
      # `type=gha` cache backend uses, producing the "Signature not
      # valid in the specified time frame" 403s the build dies on.
      #
      # Single-arch (amd64) builds complete in ~3-4 minutes, well under
      # any cache-token lifetime. The deferred edge plan already says
      # arm64 belongs on a native arm64 runner (when the Orin arrives);
      # QEMU emulation here was paying CI time for an artefact nobody
      # uses yet.
      # The detector weights are a release asset, not a git object (see
      # data/models/manifest.json). Fetch + sha256-verify them into the build
      # context; a mismatch fails here, and the Dockerfile re-checks it.
      - name: Fetch and verify model weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_model.py --image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Single-arch (amd64) only. arm64 returns when there is a
          # native arm64 runner OR an Orin actually in hand. See note
          # above the buildx step.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `ignore-error: true` on cache-to is defense in depth. Even
          # with the short amd64-only build, a cache-write SAS could
          # theoretically expire if a runner is slow. With this flag,
          # cache push failures become warnings instead of failing the
          # whole build — we still get the image; the cache misses
          # next time but that's a cost-of-cache problem, not a
          # correctness problem.
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Print image digest
        run: echo "Image digest - ${{ steps.build-and-push.outputs.digest }}"

  compose-health:
    # `docker build` succeeding does NOT mean the stack comes up. This job
    # exists because the ship-gate could only report `docker build` as proven
    # and had to file `compose up` as BLOCKED — there is no container runtime
    # on the maintainer's Windows machine, so it had never been executed
    # anywhere, by anyone.
    #
    # It runs from a CLEAN CHECKOUT, which is the point: it is the fresh-clone
    # path a stranger takes. That is how the `.env` defect was found — compose
    # used to bind-mount `./.env`, which is gitignored, so Docker created a
    # DIRECTORY at that path and the app tried to read a directory as a file.
    #
    # Wait for `build` so the GHA layer cache (including prefetch_embedder)
    # is populated. A parallel cold `compose --build` re-hits huggingface.co
    # and 429s the required check (PR #451 job 99261131077).
    name: compose up (fresh clone) + health
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Confirm this is really a fresh clone
        # If .env somehow exists here the test is not testing what it claims.
        run: |
          test ! -f .env || { echo "::error::.env exists in a clean checkout"; exit 1; }
          echo "no .env present — this is the stranger's starting state"

      # The detector weights are a release asset, not a git object (see
      # data/models/manifest.json). Fetch + sha256-verify them into the build
      # context; a mismatch fails here, and the Dockerfile re-checks it.
      - name: Fetch and verify model weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fetch_model.py --image

      # The image (~2.5 GB, loaded into the local daemon) no longer fits next
      # to the runner's preinstalled SDKs: the load failed with "no space left
      # on device". Drop toolchains this job never uses before building.
      - name: Free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image with GHA cache
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: cerebrum-blocks:local
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: docker compose up
        # Image is already loaded as cerebrum-blocks:local (shared by app +
        # worker). --no-build keeps this step off a second Hub prefetch.
        # --wait blocks until every service with a healthcheck reports healthy
        # and fails the step if any container exits or goes unhealthy first.
        run: docker compose up -d --no-build --wait --wait-timeout 600

      - name: Liveness endpoint returns 200
        run: |
          set -o pipefail
          code=$(curl -s -o /tmp/livez.json -w '%{http_code}' http://localhost:8000/livez)
          echo "GET /livez -> $code"
          cat /tmp/livez.json
          test "$code" = "200"

      - name: No service bind-mounts the gitignored .env
        # Names the failure instead of letting it surface as a generic
        # "failed to read .env: is a directory" from whatever compose command
        # runs next — which is what happened when the Redis merge reintroduced
        # the bind-mount on the `worker` service. The stack had already come
        # up HEALTHY by then, so the error pointed nowhere near the cause.
        if: always()
        run: |
          if [ -d .env ]; then
            echo "::error::A compose service bind-mounts ./.env, which is gitignored."
            echo "::error::On a fresh clone Docker creates a DIRECTORY there and the app"
            echo "::error::reads a directory as a file. Use env_file with required: false."
            grep -n '\.env' docker-compose.yml || true
            exit 1
          fi
          echo "no .env directory was created — no service bind-mounts it"

      - name: Container state and logs
        # Always, so a failure above is diagnosable without a re-run.
        if: always()
        run: |
          docker compose ps
          echo "::group::app logs"
          docker compose logs --no-color --tail=200 cerebrum-blocks
          echo "::endgroup::"

      - name: Tear down
        if: always()
        run: docker compose down -v
