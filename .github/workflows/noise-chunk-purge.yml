name: noise-chunk-purge

# Ops workflow (Advisor 19:50Z, 13 Nov, RQ-1): run
# POST /v1/admin/corpus/noise-chunks on the live deployment.
# Same shape as document-exclude.yml / corpus-ghost-tombstone.yml.
#
# Safety, in order:
#   1. A plan call (execute=false) runs first, ALWAYS. It prints the counts per
#      class (guard_sentence, empty_row, header_repeat), the exact chunk ids per
#      class, the documents touched and plan_hash. It writes nothing.
#   2. The write runs only when the operator passed execute=true AND an
#      expected_plan_hash equal to the live plan's (from an earlier plan run).
#      The route recomputes the plan and checks the hash again server-side.
#   3. The write deletes only the planned chunk ids. Documents are never
#      deleted; each touched document's chunk_count and status are re-derived.
#      A plan after the write must report total=0.
# project_id and expected_plan_hash have NO committed default.

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project to plan (no default committed)"
        required: true
      expected_plan_hash:
        description: "plan_hash from an earlier plan run; the write runs only if the live plan equals it"
        required: false
        default: ""
      execute:
        description: "false = plan only (default). true = delete the planned chunks"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  purge:
    name: Noise chunk purge (live)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.SHOVEL_BASE_URL || 'https://theshovel.ai' }}
      PROJECT_ID: ${{ inputs.project_id }}
      EXPECTED: ${{ inputs.expected_plan_hash }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Resolve CEREBRUM_MASTER_KEY from the live task definition
        run: |
          td=$(aws ecs describe-services --cluster cerebrum --services the-fork --query 'services[0].taskDefinition' --output text)
          val=$(aws ecs describe-task-definition --task-definition "$td" --query "taskDefinition.containerDefinitions[0].environment[?name=='CEREBRUM_MASTER_KEY'].value | [0]" --output text)
          if [ -z "$val" ] || [ "$val" = "None" ]; then
            ref=$(aws ecs describe-task-definition --task-definition "$td" --query "taskDefinition.containerDefinitions[0].secrets[?name=='CEREBRUM_MASTER_KEY'].valueFrom | [0]" --output text)
            case "$ref" in
              arn:aws:secretsmanager:*)
                secret_id=$(printf '%s' "$ref" | cut -d: -f1-7)
                json_key=$(printf '%s' "$ref" | cut -d: -f8)
                secret_json=$(aws secretsmanager get-secret-value --secret-id "$secret_id" --query SecretString --output text)
                if [ -n "$json_key" ]; then
                  val=$(printf '%s' "$secret_json" | JSON_KEY="$json_key" python3 -c "import os,sys,json;print(json.load(sys.stdin).get(os.environ['JSON_KEY'],''))")
                else
                  val=$secret_json
                fi
                ;;
              arn:aws:ssm:*|/*) val=$(aws ssm get-parameter --with-decryption --name "${ref##*parameter}" --query Parameter.Value --output text) ;;
            esac
          fi
          [ -n "$val" ] && [ "$val" != "None" ] || { echo "::error::CEREBRUM_MASTER_KEY is not configured on the live the-fork task definition"; exit 1; }
          echo "::add-mask::$val"; echo "CEREBRUM_MASTER_KEY=$val" >> "$GITHUB_ENV"

      - name: Plan (execute=false, always)
        run: |
          set -euo pipefail
          enc() { jq -rn --arg v "$1" '$v|@uri'; }
          url="${BASE_URL%/}/v1/admin/corpus/noise-chunks?project_id=$(enc "$PROJECT_ID")&execute=false"
          echo "POST ${url}"
          curl --fail-with-body --max-time 600 -X POST -H "Authorization: Bearer ${CEREBRUM_MASTER_KEY}" -H "Accept: application/json" -o plan.json -w "HTTP %{http_code}\n" "${url}"
          jq '.plan | del(.chunk_ids)' plan.json
          for c in guard_sentence empty_row header_repeat; do
            echo "chunk_ids[$c]:"; jq -r --arg c "$c" '.plan.chunk_ids[$c][]' plan.json
          done
          {
            echo "### Plan (execute=false)"
            echo "- counts: $(jq -c '.plan.counts' plan.json) total: $(jq -r '.plan.total' plan.json)"
            echo "- documents touched: $(jq -r '.plan.documents | length' plan.json)"
            echo "- plan_hash (live): $(jq -r '.plan.plan_hash' plan.json)"
            echo "- expected_plan_hash (operator): ${EXPECTED}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo "PLANNED=$(jq -r '.plan.plan_hash' plan.json)" >> "$GITHUB_ENV"

      - name: Refuse the write when the plan differs from the expected hash
        if: inputs.execute
        run: |
          set -euo pipefail
          if [ "$PLANNED" != "$EXPECTED" ]; then
            echo "::error::live plan_hash=${PLANNED} != expected_plan_hash=${EXPECTED}; no write was made"
            echo "**REFUSED:** plan ${PLANNED} != expected ${EXPECTED}; nothing written." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Purge (execute=true)
        if: inputs.execute
        run: |
          set -euo pipefail
          enc() { jq -rn --arg v "$1" '$v|@uri'; }
          url="${BASE_URL%/}/v1/admin/corpus/noise-chunks?project_id=$(enc "$PROJECT_ID")&execute=true&plan_hash=$(enc "$EXPECTED")"
          curl --fail-with-body --max-time 1200 -X POST -H "Authorization: Bearer ${CEREBRUM_MASTER_KEY}" -H "Accept: application/json" -o applied.json -w "HTTP %{http_code}\n" "${url}"
          jq 'del(.plan.chunk_ids)' applied.json
          [ "$(jq -r '.executed' applied.json)" = "true" ] || { echo "::error::write refused: $(jq -r '.refused' applied.json)"; exit 1; }
          url="${BASE_URL%/}/v1/admin/corpus/noise-chunks?project_id=$(enc "$PROJECT_ID")&execute=false"
          curl --fail-with-body --max-time 600 -X POST -H "Authorization: Bearer ${CEREBRUM_MASTER_KEY}" -H "Accept: application/json" -o after.json -w "HTTP %{http_code}\n" "${url}"
          {
            echo "### Write (execute=true)"
            echo "- deleted: $(jq -r '.deleted' applied.json) of planned $(jq -r '.plan.total' applied.json)"
            echo "- documents restamped: $(jq -r '.restamped | length' applied.json)"
            echo "- plan after write: $(jq -c '.plan.counts' after.json) total: $(jq -r '.plan.total' after.json)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$(jq -r '.plan.total' after.json)" = "0" ] || { echo "::error::noise chunks remain after the write"; exit 1; }

      - name: Upload responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noise-chunk-purge-response
          path: |
            plan.json
            applied.json
            after.json
          if-no-files-found: ignore
          retention-days: 7
