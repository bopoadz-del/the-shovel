name: ui-battery

# ONE-USER UI battery against the LIVE deployment (ORDERS_02NOV_0127Z/0148Z/0229Z).
# Drives the chat UI as one logged-in user and records, per question, the route
# the product TOOK vs the route expected. Uses the SAME repository secrets as
# smoke-live.yml / eval-battery.yml (never printed):
#   FORK_API_KEY  (or FORK_TOKEN, or FORK_EMAIL + FORK_PASSWORD)
#   FORK_BASE_URL (optional; defaults to the live deployment)
#
# The questions are a committed, generic file (`battery_file`, default
# tests/battery/t1.json — shapes + expected routes, NO client figures/names;
# the client-content scanner is the arbiter). Expected answers and figures never
# enter the repo. Stdout carries ONLY per-question route PASS/FAIL; the full
# per-question result (answer + provenance) is uploaded as an artifact for the
# caller to post to Drive as BATTERY_RESULT_<HHMM>Z.

on:
  workflow_dispatch:
    inputs:
      battery_file:
        description: "Path to the committed questions JSON (shapes + expected routes, no figures)"
        required: false
        default: "tests/battery/t1.json"
      project_name:
        description: "Project to run against (blank = the project with the most indexed documents)"
        required: false
        default: ""
  # Self-running (ORDERS_02NOV_0514Z): every SUCCESSFUL deploy of main runs the
  # battery against the freshly-deployed live product -- continuous acceptance
  # with no human and no classifier in the dispatch loop. A workflow_run event
  # carries no inputs, so the defaults below (tests/battery/t1.json, blank
  # project = most-indexed) apply; the job's `if` drops a run from a FAILED
  # deploy. The manual workflow_dispatch above is kept for ad-hoc re-runs.
  workflow_run:
    workflows: ["deploy-aws"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ui-battery-live
  cancel-in-progress: false

jobs:
  battery:
    name: one-user UI battery (live)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Run on a manual dispatch, OR only when the deploy that triggered us
    # SUCCEEDED (a failed deploy left the old product live; nothing new to accept).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      # A workflow_run event carries no inputs; fall back to the committed
      # defaults so the self-running path needs no arguments.
      BATTERY_FILE: ${{ inputs.battery_file || 'tests/battery/t1.json' }}
      PROJECT_NAME: ${{ inputs.project_name || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client deps (scripts only — not the full app)
        run: pip install httpx

      - name: Check credentials are configured
        env:
          FORK_API_KEY: ${{ secrets.FORK_API_KEY }}
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
          FORK_EMAIL: ${{ secrets.FORK_EMAIL }}
          FORK_PASSWORD: ${{ secrets.FORK_PASSWORD }}
        run: |
          if [ -z "$FORK_API_KEY" ] && [ -z "$FORK_TOKEN" ] && { [ -z "$FORK_EMAIL" ] || [ -z "$FORK_PASSWORD" ]; }; then
            echo "::error::Missing credentials. Add FORK_API_KEY (or FORK_TOKEN, or FORK_EMAIL + FORK_PASSWORD) as repository secrets."
            exit 1
          fi
          echo "credentials present"

      - name: Check the battery file exists
        run: |
          test -f "$BATTERY_FILE" || { echo "::error::battery_file not found: $BATTERY_FILE"; exit 1; }
          python -c "import json,sys;print('questions:', len(json.load(open(sys.argv[1]))))" "$BATTERY_FILE"

      # The seed's admin principal. The key is REQUIRED (no skip, no silent
      # pass) and is passed to the seed step ONLY — the battery run itself
      # never sees it.
      # Resolve the admin principal at run time from the LIVE the-fork task
      # definition, where the key already lives (ORDERS_02NOV_1808Z) — no repo
      # secret to add, no value pasted. The AWS keys are the same ones
      # deploy-aws.yml already uses. ::add-mask:: before any echo keeps the
      # value out of logs, artifacts and the bus.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2
      - name: Resolve CEREBRUM_MASTER_KEY from the live task definition
        run: |
          td=$(aws ecs describe-services --cluster cerebrum --services the-fork --query 'services[0].taskDefinition' --output text)
          val=$(aws ecs describe-task-definition --task-definition "$td" --query "taskDefinition.containerDefinitions[0].environment[?name=='CEREBRUM_MASTER_KEY'].value | [0]" --output text)
          if [ -z "$val" ] || [ "$val" = "None" ]; then
            ref=$(aws ecs describe-task-definition --task-definition "$td" --query "taskDefinition.containerDefinitions[0].secrets[?name=='CEREBRUM_MASTER_KEY'].valueFrom | [0]" --output text)
            case "$ref" in
              arn:aws:secretsmanager:*) val=$(aws secretsmanager get-secret-value --secret-id "$ref" --query SecretString --output text) ;;
              arn:aws:ssm:*|/*) val=$(aws ssm get-parameter --with-decryption --name "${ref##*parameter}" --query Parameter.Value --output text) ;;
            esac
          fi
          [ -n "$val" ] && [ "$val" != "None" ] || { echo "::error::CEREBRUM_MASTER_KEY is not configured on the live the-fork task definition"; exit 1; }
          echo "::add-mask::$val"; echo "CEREBRUM_MASTER_KEY=$val" >> "$GITHUB_ENV"

      # Provision the battery's own target (ORDERS_02NOV_1545Z): promote the
      # battery account to admin via the role endpoint, find-or-create
      # battery-t1, upload the committed synthetic fixtures when nothing is
      # indexed, poll to indexed. Idempotent on re-run; no value printed.
      - name: Seed the battery target (admin principal)
        env:
          FORK_API_KEY: ${{ secrets.FORK_API_KEY }}
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
          FORK_EMAIL: ${{ secrets.FORK_EMAIL }}
          FORK_PASSWORD: ${{ secrets.FORK_PASSWORD }}
          FORK_BASE_URL: ${{ secrets.FORK_BASE_URL }}
          PYTHONPATH: .
        # CEREBRUM_MASTER_KEY is inherited from $GITHUB_ENV (the resolve step
        # above); it is intentionally NOT a step-level secret mapping, so an
        # absent repo secret can't override the resolved value with empty.
        run: python scripts/ui_battery_runner.py seed

      - name: Run the battery
        env:
          FORK_API_KEY: ${{ secrets.FORK_API_KEY }}
          FORK_TOKEN: ${{ secrets.FORK_TOKEN }}
          FORK_EMAIL: ${{ secrets.FORK_EMAIL }}
          FORK_PASSWORD: ${{ secrets.FORK_PASSWORD }}
          FORK_BASE_URL: ${{ secrets.FORK_BASE_URL }}
          RESULT_FILE: battery_result.json
          PYTHONPATH: .
        run: python scripts/ui_battery_runner.py

      - name: Upload the per-question result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-result
          path: battery_result.json
          if-no-files-found: warn
