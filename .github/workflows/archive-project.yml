# Archive a project by exact name as a one-off ECS task (soft, reversible).
#
# Same shape as project-inventory.yml, but this is a WRITE: the task runs
# scripts/archive_project.py against the live task definition, which already
# carries DATABASE_URL + the RAG namespace env. The script sets
# status='archived' only — the row and RAG chunks are preserved (never purged).
# The project name arrives as a dispatch input; no project identifier is
# hardcoded in this repository.
name: archive-project

on:
  workflow_dispatch:
    inputs:
      name:
        description: "exact project name to archive (soft, reversible)"
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECS_CLUSTER: cerebrum
  TASK_FAMILY: the-fork
  SERVICE_FOR_NETWORK: the-fork

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Archive the named project as a one-off task
        env:
          NAME: ${{ inputs.name }}
        run: |
          netcfg=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$SERVICE_FOR_NETWORK" --query 'services[0].networkConfiguration' --output json)
          container=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query 'taskDefinition.containerDefinitions[0].name' --output text)
          overrides=$(jq -cn --arg c "$container" --arg name "$NAME" '{containerOverrides:[{name:$c, environment:[{name:"WORKER_COMMAND",value:"python -m scripts.archive_project"},{name:"ARCHIVE_PROJECT_NAME",value:$name}]}]}')
          arn=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "$TASK_FAMILY" --launch-type FARGATE --network-configuration "$netcfg" --overrides "$overrides" --query 'tasks[0].taskArn' --output text)
          for attempt in $(seq 1 30); do
            aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$arn" 2>/dev/null && break
            sleep 10
          done
          id=${arn##*/}
          aws logs get-log-events --log-group-name /ecs/the-fork --log-stream-name "ecs/$container/$id" --query 'events[].message' --output text | tee -a "$GITHUB_STEP_SUMMARY"
          code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$arn" --query 'tasks[0].containers[0].exitCode' --output text)
          echo "task exit code: $code"
          test "$code" = "0"
