name: dependency-audit

# Closes the "no CI-gated dependency-vuln scan" gap from the repo audit.
# Runs pip-audit against requirements.txt on every PR and on push to main,
# plus a weekly schedule so newly-disclosed advisories surface even when the
# tree is quiet.
#
# ENFORCING since 2026-08-04. The "report-only during rollout" phase promised
# a promotion once the advisory list hit zero — it never happened, and the
# green "pip-audit pass" check on PRs was structurally incapable of failing
# (`continue-on-error` + `|| true`) while two HIGH-severity runtime pins rode
# through review (cryptography CVE-2026-69247, aiohttp CVE-2026-69244).
# Found in the 2026-08-04 PRR; the advisory list was then fixed to zero.
#
# To ignore an adjudicated-unfixable advisory: add `--ignore-vuln <ID>` to
# IGNORE_ARGS below WITH a comment saying why and what would change the call
# (same convention as docs/SECURITY_TRIAGE.md). Never re-add `|| true`.
#
# Scope note: requirements-ml.txt is audited report-only in a separate step —
# it is a large ML dependency tree (torch etc.) that is not installed in the
# production web image; its findings are surfaced, not gating. That scope
# choice is stated here so it reads as a decision, not an oversight.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Adjudicated ignores go here, one `--ignore-vuln <ID>` per advisory,
      # each with a why-comment. Empty = everything gates.
      #
      # PYSEC-2026-2132 (click 8.1.8, fixed 8.3.3): UNFIXABLE while gtts is a
      # dependency — gtts 2.5.4 (its latest release) hard-caps click<8.2, so
      # pinning click 8.3.3 makes the lockfile ResolutionImpossible. Exposure
      # adjudicated as nil: click only backs the CLI entry points of
      # arq/gtts/ddgs; no server code path feeds it untrusted input. Durable
      # record in docs/SECURITY_TRIAGE.md. Re-visit when gtts releases with a
      # relaxed cap, or if gtts is dropped.
      # ADJUDICATED 2026-09-10 — PYSEC-2026-2132, click <= 8.3.2.
      #
      # The advisory is command injection in `click.edit()`, the helper that
      # shells out to $EDITOR for interactive CLI apps.
      #
      # Why it is not fixed: the fix is click 8.3.3, and `gtts==2.5.4`
      # requires `click<8.2,>=7.1`. 2.5.4 is the LATEST gtts, so there is no
      # version pair that satisfies both. Bumping click breaks the install.
      #
      # Why that is acceptable: nothing in this repository imports click at
      # all -- it is transitive, via uvicorn/typer/gtts -- so `click.edit()`
      # is unreachable. `tests/test_click_edit_is_unreachable.py` is the twin
      # that keeps this true: the day someone adds a click.edit() call, this
      # adjudication becomes false and CI says so instead of this comment
      # quietly going stale.
      #
      # Re-check when gtts lifts its ceiling.
      IGNORE_ARGS: "--ignore-vuln PYSEC-2026-2132"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit requirements.txt (gating)
        run: |
          # shellcheck disable=SC2086 — IGNORE_ARGS is deliberately word-split
          pip-audit --requirement requirements.txt --progress-spinner off $IGNORE_ARGS

      - name: Audit requirements-ml.txt (report-only — see scope note)
        continue-on-error: true
        run: |
          pip-audit --requirement requirements-ml.txt --progress-spinner off || {
            echo "::warning::requirements-ml.txt has open advisories (report-only — not installed in the production web image)"
            exit 1
          }
