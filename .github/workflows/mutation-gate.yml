name: mutation-gate

# CI-M (ORDERS_29OCT_1710Z-B): a gate, not a report. Every function this PR
# changes under app/ gets the standard mutants (constant return, drop a rule,
# swallow an exception, bypass a dispatcher); any survivor, or a changed
# function no test references, is red. New value tests must carry >= 2
# distinct inputs. No allowlists.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: mutation-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-gate:
    name: Mutation gate (CI-M)
    # CI runs the full suite incl. CI-M once per PR, on the READY state. A
    # draft PR runs only the fast checks (fast.yml); CI-M is skipped while the
    # PR is a draft and runs once it is marked ready (ready_for_review fires
    # with draft=false, as does a synchronize push to a non-draft PR).
    if: ${{ ! github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ENV: testing
      CEREBRUM_VIRGIN: "true"
      RAG_EMBEDDING_MODEL: fake
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A random development key for this run
        run: echo "CEREBRUM_DEV_KEY=dev-$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: Data dir for this run
        run: echo "DATA_DIR=$RUNNER_TEMP/data-cim" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout

      - name: Mutants on changed functions + two-input test lint
        run: |
          # Diff against the CURRENT base branch tip, not the stale
          # ``pull_request.base.sha``: a PR opened before another PR merged
          # would otherwise mutate functions the other PR changed (they are in
          # the base's advance, not this PR), producing uncovered mutants this
          # PR neither touches nor should have to kill.
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          BASE="$(git rev-parse FETCH_HEAD)"
          python3 scripts/mutation_gate.py --base "$BASE" \
            --src app --tests tests --workdir . \
            --pytest-arg=--timeout=120 --pytest-arg=--ignore=tests/browser \
            --summary "$RUNNER_TEMP/cim.md"

      - name: Post CI-M results on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f "$RUNNER_TEMP/cim.md" || exit 0
          cat "$RUNNER_TEMP/cim.md" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/cim.md" || echo "comment not posted"
