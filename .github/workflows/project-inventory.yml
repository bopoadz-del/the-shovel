# Run a READ-ONLY per-project inventory as a one-off ECS task.
#
# The task runs the existing `the-fork` task definition (which already carries
# DATABASE_URL and the RAG namespace env) with a command override that runs
# scripts/project_inventory.py. Nothing writes: the script issues parameterised
# SELECTs only, and the workflow has no write step and contents:read.
# The project id arrives as a dispatch input -- no project identifier lives in
# this repository.
name: project-inventory

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "project id to count (read-only)"
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: us-west-2
  ECS_CLUSTER: cerebrum
  TASK_FAMILY: the-fork
  SERVICE_FOR_NETWORK: the-fork

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run the read-only count as a one-off task
        env:
          PID: ${{ inputs.project_id }}
        run: |
          netcfg=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$SERVICE_FOR_NETWORK" --query 'services[0].networkConfiguration' --output json)
          container=$(aws ecs describe-task-definition --task-definition "$TASK_FAMILY" --query 'taskDefinition.containerDefinitions[0].name' --output text)
          overrides=$(jq -cn --arg c "$container" --arg pid "$PID" '{containerOverrides:[{name:$c, command:["python","scripts/project_inventory.py"], environment:[{name:"INVENTORY_PROJECT_ID",value:$pid}]}]}')
          arn=$(aws ecs run-task --cluster "$ECS_CLUSTER" --task-definition "$TASK_FAMILY" --launch-type FARGATE --network-configuration "$netcfg" --overrides "$overrides" --query 'tasks[0].taskArn' --output text)
          until aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$arn" 2>/dev/null; do :; done
          id=${arn##*/}
          aws logs get-log-events --log-group-name /ecs/the-fork --log-stream-name "ecs/$container/$id" --query 'events[].message' --output text | tee -a "$GITHUB_STEP_SUMMARY"
