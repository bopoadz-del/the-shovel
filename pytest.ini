[pytest]
asyncio_mode = auto

# Fail on unknown markers and on a malformed config — a typo
# (e.g. @pytest.mark.asyncoi) becomes an error, not a silent no-op.
addopts = --strict-markers --strict-config

markers =
    extended_boot: requires CEREBRUM_VIRGIN=false (extended platform blocks)
    construction_kit: requires CEREBRUM_DOMAIN_KITS=construction
    browser: Playwright UI nightly (ignored by the default pytest gate)
    serial: measures timing under its own load; CI runs these outside the xdist pool, in their own step
    timing: asserts wall-clock latency; CI runs these without coverage instrumentation, whose own per-thread lock is not the product
